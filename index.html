<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 12 Semanas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="neural-bg"></div>
    <div class="main-bg-texture"></div>

    <div class="container">
        <!-- PAINEL PRINCIPAL: FORMULÁRIO -->
        <div class="glass-panel text-center" id="painelPrincipal">
            <div class="brand-logo"><span class="silver-text">TÁ</span> <span class="gold-text">PAGO</span></div>
            
            <div class="instruction-box">
                <div class="instruction-title">Regra das 12 Semanas</div>
                <div class="rule-item">
                    <i class="fas fa-hourglass-half"></i>
                    <span><strong>Curto Prazo:</strong> O ano agora tem 12 semanas. O que não for feito agora, não será feito depois.</span>
                </div>
                <div class="rule-item">
                    <i class="fas fa-bullseye"></i>
                    <span><strong>Foco Único:</strong> Escolha apenas UMA meta principal para este ciclo.</span>
                </div>
            </div>

            <!-- Coloque sua URL do FormSubmit no action abaixo -->
            <form id="formDozeSemanas" action="SUA_URL_AQUI" method="POST">
                
                <!-- Exemplo das "bolinhas" corrigidas -->
                <div class="radio-group" style="text-align: left; margin-bottom: 20px;">
                    <label class="sub-label">Nível de Comprometimento:</label>
                    <label class="radio-label">
                        <input type="radio" name="compromisso" value="total" required>
                        Inegociável (Vou até o fim)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="compromisso" value="parcial" required>
                        Vou tentar (Risco de falhar)
                    </label>
                </div>

                <div class="input-group">
                    <i class="fas fa-flag-checkered input-icon"></i>
                    <input type="text" name="meta_principal" class="input-glass" placeholder="Qual é a sua Meta Principal?" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-fire input-icon"></i>
                    <input type="text" name="motivacao" class="input-glass" placeholder="Por que isso é inegociável?" required>
                </div>

                <div class="cta-box">
                    <button type="submit" class="btn-cta">Firmar Compromisso</button>
                </div>
            </form>
        </div>

        <!-- PAINEL DE SUCESSO (Oculto inicialmente) -->
        <div class="glass-panel text-center hidden" id="telaSucesso">
            <div class="brand-logo"><span class="gold-text">COMPROMISSO FIRMADO</span></div>
            <div class="instruction-box" style="text-align: center; border-left: none;">
                <i class="fas fa-check-circle" style="font-size: 3rem; color: var(--green); margin-bottom: 20px;"></i>
                <p style="color: #fff; font-size: 1.1rem; font-weight: bold;">Suas 12 semanas começam agora.</p>
                <p style="color: #aaa; font-size: 0.9rem; margin-top: 10px;">Seus dados foram registrados com sucesso.</p>
            </div>
            <button class="banner-btn-refazer" onclick="location.reload()" style="margin-top: 20px;">Voltar</button>
        </div>
    </div>

    <!-- SCRIPT QUE MATA A TELA BRANCA DO "THANKS!" -->
    <script>
        document.getElementById('formDozeSemanas').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const btn = document.querySelector('.btn-cta');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "Processando...";
            btn.disabled = true;

            const formData = new FormData(this);

            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('painelPrincipal').classList.add('hidden');
                    document.getElementById('telaSucesso').classList.remove('hidden');
                } else {
                    alert("Erro ao enviar. Verifique o link do FormSubmit.");
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                alert("Erro de conexão.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
